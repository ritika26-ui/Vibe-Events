<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aesthetic Event Explorer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,400&family=Nunito:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen bg-cover bg-center bg-fixed text-gray-800" style="background-image: url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=2000&auto=format&fit=crop');">
  
  <div class="fixed inset-0 bg-black/20 z-0"></div>

  <div class="relative z-10 container mx-auto px-4 py-12 max-w-5xl">
    
    <header class="text-center mb-12 text-white drop-shadow-md fade-in">
      <h1 class="text-5xl md:text-6xl font-bold mb-3 font-serif tracking-wide">Wanderlust Events</h1>
      <p class="text-lg md:text-xl font-light font-sans opacity-90">Curating magical moments & unforgettable memories</p>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      
      <div class="lg:col-span-1">
        <div class="glass-panel p-6 rounded-2xl shadow-xl slide-up">
          <h2 class="text-2xl font-serif font-bold text-gray-900 mb-5">Create Magic</h2>
          <form id="eventForm" class="space-y-4 font-sans">
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-1">Event Title</label>
              <input type="text" id="eventName" class="w-full px-4 py-2 rounded-lg bg-white/60 border border-white/50 focus:outline-none focus:ring-2 focus:ring-green-400 transition" placeholder="e.g., Summer Solstice Festival" required>
            </div>
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-1">Date</label>
              <input type="date" id="eventDate" class="w-full px-4 py-2 rounded-lg bg-white/60 border border-white/50 focus:outline-none focus:ring-2 focus:ring-green-400 transition" required>
            </div>
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-1">Location</label>
              <input type="text" id="eventLocation" class="w-full px-4 py-2 rounded-lg bg-white/60 border border-white/50 focus:outline-none focus:ring-2 focus:ring-green-400 transition" placeholder="e.g., Whispering Woods" required>
            </div>
            <button type="submit" class="w-full py-3 mt-2 bg-emerald-600/90 hover:bg-emerald-700 text-white font-semibold rounded-lg shadow-lg hover:shadow-xl transition duration-300 transform hover:-translate-y-1">
              Add Event
            </button>
          </form>
        </div>
      </div>

      <div class="lg:col-span-2">
        <div id="eventList" class="grid grid-cols-1 sm:grid-cols-2 gap-6">
          </div>
      </div>

    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
